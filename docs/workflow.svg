<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Workflow: Planning sets up WO and part lines, Engineering maps tooling, Stores issues, Production acknowledges, tooling runs, then it is returned or handed to the next setup, inspected and released.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #14233f; }
    .sub { font-size: 13px; fill: #5b6475; }
    .n { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .d { font-size: 12.5px; fill: #ffffff; opacity: .95; }
    .note { font-size: 12.5px; fill: #14233f; font-weight: 600; }
    .flow { fill: none; stroke: #9aa5b8; stroke-width: 3; stroke-linejoin: round; stroke-dasharray: 8 8; animation: dash 1.2s linear infinite; }
    .hand { fill: none; stroke: #c2410c; stroke-width: 3; stroke-linejoin: round; stroke-dasharray: 3 7; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -16; } }
    .box { animation: glow 14s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { filter: none; } 50% { filter: brightness(1.12); } }
  </style>
  <rect width="1100" height="560" rx="18" fill="#f4f6fa"/>
  <text x="30" y="42" class="title">VSPL Tool &amp; Die Management: how tooling moves</text>
  <text x="30" y="64" class="sub">Planning plans, Engineering maps, Stores issues, Production runs, Stores takes back, Tooling inspects, Engineering releases</text>

  <!-- the path the dots follow, and its dashed track -->
  <path id="flow" class="flow" d="M145,145 H955 V245 H145 V335 H955 V455 H415 H145 V335"/>
  <path id="hand" class="hand" d="M685,370 V404 H215 V370"/>
  <text x="450" y="397" text-anchor="middle" class="note" fill="#c2410c" style="fill:#c2410c">same die set, next setup: handed on, no return to stores</text>

  <!-- row A: planning side -->
  <g class="box"><rect x="30" y="110" width="230" height="70" rx="12" fill="#2563eb"/><text x="46" y="136" class="n">1  Planning</text><text x="46" y="158" class="d">Excel sheet or typed lines</text></g>
  <g class="box"><rect x="300" y="110" width="230" height="70" rx="12" fill="#2563eb"/><text x="316" y="136" class="n">2  Setup</text><text x="316" y="158" class="d">one tooling set, several WO / parts</text></g>
  <g class="box"><rect x="570" y="110" width="230" height="70" rx="12" fill="#7c3aed"/><text x="586" y="136" class="n">3  Engineering</text><text x="586" y="158" class="d">tool rules + die mapping</text></g>
  <g class="box"><rect x="840" y="110" width="230" height="70" rx="12" fill="#7c3aed"/><text x="856" y="136" class="n">4  Matched</text><text x="856" y="158" class="d">die set found for the setup</text></g>

  <!-- row B: shop floor -->
  <g class="box"><rect x="30" y="300" width="230" height="70" rx="12" fill="#16a34a"/><text x="46" y="326" class="n">5  Stores: Issue</text><text x="46" y="348" class="d">pick the setup, press Issue</text></g>
  <g class="box"><rect x="300" y="300" width="230" height="70" rx="12" fill="#ea580c"/><text x="316" y="326" class="n">6  Production</text><text x="316" y="348" class="d">acknowledges receipt</text></g>
  <g class="box"><rect x="570" y="300" width="230" height="70" rx="12" fill="#ea580c"/><text x="586" y="326" class="n">7  In production</text><text x="586" y="348" class="d">usage from OMS, per WO / part</text></g>
  <g class="box"><rect x="840" y="300" width="230" height="70" rx="12" fill="#16a34a"/><text x="856" y="326" class="n">8  Return to stores</text><text x="856" y="348" class="d">parts + unused coating, one click</text></g>

  <!-- row C: quality -->
  <g class="box"><rect x="570" y="420" width="230" height="70" rx="12" fill="#0d9488"/><text x="586" y="446" class="n">9  Tooling: inspect</text><text x="586" y="468" class="d">checklist; a fail goes on hold</text></g>
  <g class="box"><rect x="300" y="420" width="230" height="70" rx="12" fill="#7c3aed"/><text x="316" y="446" class="n">10  Engineering: release</text><text x="316" y="468" class="d">serviceable again, ready to issue</text></g>
  <text x="30" y="472" class="note" style="fill:#14233f">back in stores</text>
  <text x="30" y="490" class="sub">ready for the next setup</text>

  <!-- moving dots: tooling travelling the loop -->
  <circle r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="3"><animateMotion dur="16s" repeatCount="indefinite" rotate="auto" begin="0s"><mpath href="#flow"/></animateMotion></circle>
  <circle r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="3"><animateMotion dur="16s" repeatCount="indefinite" begin="-5.3s"><mpath href="#flow"/></animateMotion></circle>
  <circle r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="3"><animateMotion dur="16s" repeatCount="indefinite" begin="-10.6s"><mpath href="#flow"/></animateMotion></circle>
  <circle r="8" fill="#c2410c" stroke="#ffffff" stroke-width="3"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#hand"/></animateMotion></circle>

  <!-- legend -->
  <g font-size="12.5">
    <rect x="30" y="520" width="14" height="14" rx="3" fill="#2563eb"/><text x="50" y="532" class="sub">Planning</text>
    <rect x="130" y="520" width="14" height="14" rx="3" fill="#7c3aed"/><text x="150" y="532" class="sub">Engineering</text>
    <rect x="250" y="520" width="14" height="14" rx="3" fill="#16a34a"/><text x="270" y="532" class="sub">Stores</text>
    <rect x="340" y="520" width="14" height="14" rx="3" fill="#ea580c"/><text x="360" y="532" class="sub">Production</text>
    <rect x="450" y="520" width="14" height="14" rx="3" fill="#0d9488"/><text x="470" y="532" class="sub">Tooling</text>
    <circle cx="570" cy="527" r="7" fill="#f59e0b"/><text x="584" y="532" class="sub">tooling moving through the loop</text>
    <circle cx="800" cy="527" r="7" fill="#c2410c"/><text x="814" y="532" class="sub">hand-over to the next setup</text>
  </g>
</svg>
